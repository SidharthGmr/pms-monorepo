<!--preheader: You are subscribed to {{PlatformName}} - new arrivals and offers, no noise.-->
<!--footer: You received this email because {{Email}} was subscribed on {{WebsiteUrl}}.-->

<h1 class="ink" style="margin:0;font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-0.2px;color:#0f172a;">You are on the list</h1>
<p class="body-text" style="margin:14px 0 0 0;font-size:15px;line-height:1.7;color:#475569;">Thanks for subscribing to {{PlatformName}}. We will send new arrivals, restocks and the occasional offer - and nothing else.</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0 0 0;">
  <tr>
    <td class="panel" bgcolor="#f8fafc" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;">
      <p class="muted" style="margin:0 0 4px 0;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#94a3b8;">Subscribed address</p>
      <p class="ink" style="margin:0;font-size:15px;font-weight:700;color:#0f172a;word-break:break-all;">{{Email}}</p>
    </td>
  </tr>
</table>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:28px auto 6px auto;">
  <tr>
    <td align="center" bgcolor="#092a55" style="border-radius:10px;background:#092a55;">
      <a href="{{siteUrl}}" target="_blank" style="display:inline-block;padding:14px 36px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px;">Start browsing</a>
    </td>
  </tr>
</table>

<p class="muted" style="margin:20px 0 0 0;font-size:13px;line-height:1.7;text-align:center;color:#94a3b8;">Changed your mind? Every email we send carries an unsubscribe link.</p>
