<!--preheader: {{name}} sent a message through the contact form: {{subject}}-->
<!--footer: You received this email because a contact form was submitted on {{WebsiteUrl}}.-->

<p class="muted" style="margin:0;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#94a3b8;">Contact form</p>
<h1 class="ink" style="margin:6px 0 0 0;font-size:22px;line-height:1.35;font-weight:700;letter-spacing:-0.2px;color:#0f172a;">{{subject}}</h1>
<p class="body-text" style="margin:12px 0 0 0;font-size:15px;line-height:1.7;color:#475569;">From <strong style="color:#0f172a;">{{name}}</strong> &middot; received {{receivedAt}}</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:22px 0 0 0;">
  <tr>
    <td class="panel" bgcolor="#f8fafc" style="background:#f8fafc;border:1px solid #e2e8f0;border-left:3px solid #02a98f;border-radius:0 12px 12px 0;padding:18px 20px;">
      <p class="muted" style="margin:0 0 8px 0;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#94a3b8;">Message</p>
      <p class="body-text" style="margin:0;font-size:15px;line-height:1.75;color:#334155;white-space:pre-line;">{{messageBody}}</p>
    </td>
  </tr>
</table>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:20px 0 0 0;">
  <tr>
    <td class="panel" style="border:1px solid #e2e8f0;border-radius:12px;padding:6px 20px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td class="stack" style="padding:10px 0;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#94a3b8;font-weight:700;white-space:nowrap;vertical-align:top;">Email</td>
          <td class="stack" align="right" style="padding:10px 0 10px 16px;font-size:14px;font-weight:700;word-break:break-word;"><a href="mailto:{{email}}" style="color:#092a55;text-decoration:none;">{{email}}</a></td>
        </tr>
        <tr>
          <td class="stack rule" style="padding:10px 0;border-top:1px solid #e9eef5;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#94a3b8;font-weight:700;white-space:nowrap;vertical-align:top;">Phone</td>
          <td class="stack rule" align="right" style="padding:10px 0 10px 16px;border-top:1px solid #e9eef5;font-size:14px;color:#0f172a;font-weight:700;word-break:break-word;">{{phone}}</td>
        </tr>
      </table>
    </td>
  </tr>
</table>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:26px auto 6px auto;">
  <tr>
    <td align="center" bgcolor="#092a55" style="border-radius:10px;background:#092a55;">
      <a href="{{replyTo}}" target="_blank" style="display:inline-block;padding:13px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px;">Reply to {{name}}</a>
    </td>
  </tr>
</table>
